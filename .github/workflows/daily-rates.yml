name: 每日匯率

on:
  schedule:
    - cron: "23 8 * * 1-5" # 台北時間週一至週五 16:23
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 測試解析程式
        run: python -m unittest discover -s tests -v
      - name: 抓取臺灣銀行牌告匯率
        run: python scripts/fetch_rates.py
      - name: 提交匯率檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add rates
          if git diff --cached --quiet; then
            echo "匯率沒有變動"
            exit 0
          fi
          git commit -m "更新 $(TZ=Asia/Taipei date +%F) 匯率"
          git push
